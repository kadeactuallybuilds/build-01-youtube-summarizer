name: Stuck at a step
description: A setup step in the README did not show what "You should see" says.
title: "Stuck at Step "
body:
  - type: input
    id: step
    attributes:
      label: Which step?
      description: The step number from the README, for example 4b.
      placeholder: "4b"
    validations:
      required: true
  - type: textarea
    id: typed
    attributes:
      label: What you typed
      description: Copy the exact line you typed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw
      description: Copy the full message from the terminal. Replace your own name if it appears in a folder path.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
